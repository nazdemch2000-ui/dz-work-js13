<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Task List</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="container py-5">
      <h2 class="text-center mb-4">Task List</h2>

      <form id="taskForm" class="d-flex gap-2 mb-4">
        <input
          type="text"
          id="newTask"
          class="form-control"
          placeholder="Enter a new task"
        />

        <button type="submit" id="addBtn" class="btn btn-primary">Add</button>
      </form>

      <div class="d-flex gap-2 mb-4">
        <button id="allBtn" class="btn btn-primary">All</button>

        <button id="activeBtn" class="btn btn-outline-primary">Active</button>

        <button id="completedBtn" class="btn btn-outline-primary">
          Completed
        </button>
        <button id="resetBtn" class="btn btn-outline-primary">Reset</button>
      </div>

      <ul id="taskList" class="list-group"></ul>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="scr/script.js"></script>
  </body>
</html>
